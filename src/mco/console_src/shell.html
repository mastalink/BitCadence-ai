<style>/* BitCadence — design tokens. Light enterprise SaaS. */
:root {
  --font-sans: "Geist", -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Consolas, monospace;

  /* Neutrals */
  --bg: #f7f7f8;
  --surface: #ffffff;
  --surface-2: #fbfbfc;
  --border: #e4e4e9;
  --border-strong: #d4d4dc;
  --text: #17171c;
  --text-2: #5e5e6b;
  --text-3: #8f8f9c;

  /* Accent (overridden by Tweaks) */
  --accent: #5b5bd6;
  --accent-strong: #4747c2;
  --accent-soft: #eeeefb;
  --accent-text: #4a4ac4;

  /* Status hues */
  --st-waiting-bg: #faf3e3;     --st-waiting-fg: #9a6b0c;   --st-waiting-dot: #d9a514;
  --st-approval-bg: #fdeee3;    --st-approval-fg: #b04e12;  --st-approval-dot: #e8702a;
  --st-pending-bg: #e6f3f6;     --st-pending-fg: #0e6b80;   --st-pending-dot: #1995b3;
  --st-active-bg: #e9eefb;      --st-active-fg: #2f54bd;    --st-active-dot: #4570e6;
  --st-done-bg: #e5f4ea;        --st-done-fg: #1a7a3e;      --st-done-dot: #2aa45a;
  --st-failed-bg: #fcebea;      --st-failed-fg: #b3261e;    --st-failed-dot: #dd4840;
  --st-rejected-bg: #f1f1f3;    --st-rejected-fg: #5e5e6b;  --st-rejected-dot: #9c9ca8;

  --radius-s: 6px;
  --radius-m: 10px;
  --radius-l: 14px;
  --shadow-s: 0 1px 2px rgba(23, 23, 28, 0.05);
  --shadow-m: 0 1px 3px rgba(23, 23, 28, 0.06), 0 4px 16px rgba(23, 23, 28, 0.06);
  --shadow-l: 0 4px 12px rgba(23, 23, 28, 0.08), 0 16px 48px rgba(23, 23, 28, 0.14);

  /* Density (overridden by Tweaks) */
  --row-pad: 10px;
  --card-pad: 20px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font-family: var(--font-sans); }
input, select, textarea { font-family: var(--font-sans); }
::selection { background: var(--accent-soft); }

@keyframes cadence-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
