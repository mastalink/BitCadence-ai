non_goals = ["fixing gaps (R0-02)", "touching the live fleet"]
acceptance = ["python scripts/assess_agentd.py (isolated home by design) exits 0 and writes an evidence table", "DECISIONS.md section 5 updated with the verdict"]
evidence = ["evidence table", "popup-watch log"]
fault_injection = ["kill the supervisor -> no orphans", "flooding child -> no deadlock"]
