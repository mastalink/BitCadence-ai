# BitCadence build DAG - read by `bitcadence handoff` (package H-00).
# Design: docs/architecture/DECISIONS.md, docs/adr/0004-*.md, docs/adr/0005-*.md.
#
# Repos are logical names. "bitcadence" is this public repository (invariant 13: neutral content only).
# "private-content" and any other private repo resolve through private deployment configuration
# (~/.mco/deployment/repos.toml); their paths never appear here.
#
# activation = true marks a package whose *production activation* is gated by evidence + owner sign-off. Completing
# the code is not enough; the harness stops at an approval job after the evidence is attached.
# reviewers: model families asked to review (never the builder's family); min_families is enforced by the harness.

[program]
name = "runtime-desktop-plugins"
namespace = "8b3c1f0e-5d0a-4c7e-9b1e-2f6a4d8c9e10"      # uuid5 namespace for deterministic job ids
builder = { role = "codex", family = "gpt" }            # instance pinned in private config
merge_gate = { role = "light", requires_approval = true }
default_reviewers = ["claude", "gemini"]
min_families = 2
max_fix_rounds = 3
commands = { py = "python -m pytest -q -o addopts=", rust = "cargo fmt --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace", ui = "pnpm install --frozen-lockfile && pnpm typecheck && pnpm test && pnpm build", neutral = "python scripts/check_neutrality.py --diff origin/main", popup = "pwsh -File <popup-watch> -Seconds 60   # deployment tool; path from private config" }

# ----------------------------------------------------------------------------------------------- N: neutrality
[[wp]]
id = "N-01"
title = "Neutrality guard, exposure audit, neutralize current tracked debt"
stage = "N"
repo = "bitcadence"
depends = []
scope = ["scripts/check_neutrality.py (diff + full modes, private denylist)", "CI pull-request job", "replace deployment-specific names/paths in tracked files with synthetic names or config lookups", "move deployment runbooks to a private repo (owner names the target)"]
non_goals = ["rewriting git history (owner decision)", "changing behaviour"]
acceptance = ["{py} tests/test_check_neutrality.py", "python scripts/check_neutrality.py --all  (with the private denylist) reports 0 deployment terms outside an owner-approved allowlist", "{py}  (full suite green)"]
evidence = ["before/after --all --summary counts", "private exposure report updated"]
fault_injection = ["a PR adding a user-profile path fails CI", "a reviewed line with 'neutrality: allow' passes"]
reviewers = ["claude", "gemini"]
risk = "low"
rollback = "revert commit"
size = "L"

[[wp]]
id = "N-02"
title = "Land the neutralized cockpit branch (optional herdr host, review fan-out)"
stage = "N"
repo = "bitcadence"
depends = ["N-01"]
scope = ["merge feat/cockpit-herdr after review: config-only herdr location, role-only default review panel, generic ADR 0003"]
non_goals = ["runtime integration (R0-02)"]
acceptance = ["{py} tests/test_cockpit.py tests/test_reviews.py tests/test_fleet.py", "{neutral}"]
evidence = ["review verdicts from 2 families"]
fault_injection = ["herdr absent -> clear error, no fallback path"]
reviewers = ["claude", "gemini"]
risk = "low"
rollback = "revert merge"
size = "S"

# ----------------------------------------------------------------------------------------------- H: harness
[[wp]]
id = "H-00"
title = "Handoff harness: post/advance/status/watch for this DAG"
stage = "H"
repo = "bitcadence"
depends = []
scope = ["src/mco/handoff.py + CLI", "client.send(job_id=...)", "reviews.fanout(depends_on, job_ids)", "deterministic uuid5 ids", "build -> PR -> fan-out review -> fix rounds -> approval-gated merge -> next", "watch loop as a runtime/cockpit process, never an OS task"]
non_goals = ["merging without owner approval", "posting a dependency that does not exist yet"]
acceptance = ["{py} tests/test_handoff.py tests/test_reviews.py", "bitcadence handoff post --program docs/plan/packages.toml --dry-run prints the first ready packages", "posting twice is a no-op (test)"]
evidence = ["advance tests with fake gh + fake client"]
fault_injection = ["review fails -> fix round; 4th failure -> escalation", "checks red -> no merge job", "harness restart mid-round -> no duplicate jobs"]
reviewers = ["claude", "gemini"]
risk = "medium"
rollback = "cancel the program's open jobs; revert"
size = "M"

