[package]
name = "bitcadence-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.6", features = ["isolation"] }

[dependencies]
serde_json = "=1.0.150"
tauri = { version = "=2.12.7", default-features = false, features = ["wry", "compression", "isolation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
